name: Build & Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Setup Gradle Wrapper (Gradle 8.4)
        run: |
          flutter create --project-name=temp_app temp_app
          cp -n temp_app/android/gradlew android/ || true
          cp -rn temp_app/android/gradle android/ || true
          chmod +x android/gradlew
          rm -rf temp_app
          mkdir -p android/gradle/wrapper
          cat << 'EOF' > android/gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Patch Code for Compatibility
        run: |
          # 1. Update flutter_foreground_task ke versi ^8.17.0
          sed -i 's/flutter_foreground_task:.*/flutter_foreground_task: ^8.17.0/' pubspec.yaml

          # 2. Perbaiki DialogThemeData -> DialogTheme di app_theme.dart
          sed -i 's/DialogThemeData/DialogTheme/g' lib/theme/app_theme.dart

          # 3. Sesuaikan onDestroy dengan versi 8.x
          sed -i 's/onDestroy(DateTime timestamp)/onDestroy(DateTime timestamp, bool isTimeout)/g' lib/services/timer_task_handler.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fikri-tracker-release
          path: build/app/outputs/flutter-apk/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Fikri Tracker Release v1.0.${{ github.run_number }}"
          files: build/app/outputs/flutter-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
